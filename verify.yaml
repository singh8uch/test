'on':
  execute:
    inputs: {}
jobs:
  verify:
    steps:
      - name: locate checked-out files anywhere in the run tree
        run: |
          echo "PWD=$(pwd)"
          root="$(pwd | sed -E 's#(.*/jobs/[^/]+).*#\1#')"
          echo "RUN_ROOT=$root"
          echo "=== checked-out repo files found under run root ==="
          find "$root" -maxdepth 8 \( -name 'json.yaml' -o -name 'workflow.yaml' -o -name 'something.yaml' -o -name 'verify.yaml' \) 2>/dev/null
